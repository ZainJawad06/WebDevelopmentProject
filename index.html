      <!-- Main Full-Screen Canvas Area -->

    <!-- PURE JAVASCRIPT LOGIC (Auto-Sync, Resilient Cloud Connection) -->
    <script>
      // Project URL and public anon key. Safe to be public because Row Level Security controls access.
      const supabaseUrl = 'https://hsztbpkulujygxlaquxj.supabase.co';
      const supabaseAnonKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhzenRicGt1bHVqeWd4bGFxdXhqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE0MTAxNzQsImV4cCI6MjEwNjk4NjE3NH0.0KMFEwFgEhUmMrlYeSonyG409BfvUSSBB7bI9G4IvpY';

      // Initialize Supabase Client
      const supabaseClient = window.supabase ? window.supabase.createClient(supabaseUrl, supabaseAnonKey) : null;

      const STORAGE_KEY = 'mediremind_data';

      // Default initial prescriptions matching the reference UI
      const demoMedicines = [
        { id: 101, name: 'Amoxicillin', dosage: '500mg, 1 capsule', scheduled_time: '08:00', stock: 22, notes: 'Take after breakfast', is_taken: false },
        { id: 102, name: 'Vitamin D3', dosage: '1000 IU, 1 drop', scheduled_time: '13:00', stock: 12, notes: 'Take with water', is_taken: true },
        { id: 103, name: 'Metformin', dosage: '500mg, 1 tablet', scheduled_time: '20:30', stock: 4, notes: 'Take with dinner', is_taken: false }
      ];

      // Application State
      let medicineList = [];
      let activeSection = 'dashboard';
      let currentFilter = 'all';
      let searchQuery = '';
      let isCloudConnected = false;

      // Sound & Notification System (Web Audio API Synthesizer)
      let audioCtx = null;
      let soundEnabled = true;
      let notificationHistory = [];
      const alertedReminders = new Set();

      function getAudioContext() {
        if (!audioCtx) {
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          if (AudioContextClass) audioCtx = new AudioContextClass();
        }
        if (audioCtx && audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
        return audioCtx;
      }

      // Unlock Web Audio on first user interaction
      ['click', 'touchstart', 'keydown'].forEach((evt) => {
        document.addEventListener(evt, () => getAudioContext(), { once: true, passive: true });
      });

      // Synthesizer chimes with Web Audio API
      function playNotificationSound(type = 'default') {
        if (!soundEnabled) return;
        try {
          const ctx = getAudioContext();
          if (!ctx) return;
          const now = ctx.currentTime;

          if (type === 'alarm') {
            // Melodic Ding-Dong sequence for "Medicine Timeee!!!"
            const playTone = (freq, start, duration, gainLevel = 0.22, oscType = 'sine') => {
              const osc = ctx.createOscillator();
              const gain = ctx.createGain();
              osc.type = oscType;
              osc.frequency.setValueAtTime(freq, start);
              gain.gain.setValueAtTime(gainLevel, start);
              gain.gain.exponentialRampToValueAtTime(0.0001, start + duration);
              osc.connect(gain);
              gain.connect(ctx.destination);
              osc.start(start);
              osc.stop(start + duration + 0.05);
            };

            // First Ding-Dong
            playTone(659.25, now, 0.22, 0.25, 'sine');          // E5
            playTone(880.00, now + 0.12, 0.35, 0.3, 'triangle'); // A5
            // Second celebratory Ding-Dong (higher chime)
            playTone(659.25, now + 0.35, 0.2, 0.22, 'sine');    // E5
            playTone(1046.50, now + 0.48, 0.5, 0.35, 'triangle'); // C6
          } else if (type === 'add') {
            // Cheerful ascending chime (C5 -> E5 -> G5)
            [523.25, 659.25, 783.99].forEach((freq, idx) => {
              const osc = ctx.createOscillator();
              const gain = ctx.createGain();
              osc.type = 'triangle';
              const st = now + idx * 0.07;
              osc.frequency.setValueAtTime(freq, st);
              gain.gain.setValueAtTime(0.2, st);
              gain.gain.exponentialRampToValueAtTime(0.0001, st + 0.25);
              osc.connect(gain);
              gain.connect(ctx.destination);
              osc.start(st);
              osc.stop(st + 0.26);
            });
          } else if (type === 'delete') {
            // Gentle descending tone
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(440, now);
            osc.frequency.exponentialRampToValueAtTime(260, now + 0.24);
            gain.gain.setValueAtTime(0.18, now);
            gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.25);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(now);
            osc.stop(now + 0.26);
          } else {
            // Default bright ping
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(587.33, now); // D5
            osc.frequency.exponentialRampToValueAtTime(880, now + 0.08); // A5
            gain.gain.setValueAtTime(0.2, now);
            gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.25);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(now);
            osc.stop(now + 0.26);
          }
        } catch (e) {
          console.warn('Audio synthesis notice:', e);
        }
      }

      function toggleSound() {
        soundEnabled = !soundEnabled;
        const icon = document.getElementById('sound-icon');
        const panelIcon = document.getElementById('panel-sound-icon');
        const soundBtn = document.getElementById('sound-toggle-btn');
        const iconName = soundEnabled ? 'volume-2' : 'volume-x';
        
        if (icon) icon.setAttribute('data-lucide', iconName);
        if (panelIcon) panelIcon.setAttribute('data-lucide', iconName);
        if (soundBtn) soundBtn.title = soundEnabled ? 'Notification Sound: ON' : 'Notification Sound: MUTED';

        lucide.createIcons();
        if (soundEnabled) {
          playNotificationSound('default');
          showNotification({ title: 'Sound Enabled 🔊', message: 'Alert chimes and reminders will play audio.', type: 'info', soundType: 'default', skipSound: false });
        } else {
          showNotification({ title: 'Sound Muted 🔇', message: 'Notifications will appear silently.', type: 'info', soundType: 'default', skipSound: true });
        }
      }

      function toggleNotificationPanel() {
        const panel = document.getElementById('notifications-panel');
        if (!panel) return;
        const isHidden = panel.style.display === 'none' || panel.style.display === '';
        panel.style.display = isHidden ? 'flex' : 'none';
        if (isHidden) {
          // Clear badge
          const badge = document.getElementById('nav-bell-badge');
          if (badge) badge.style.display = 'none';
          updateNotificationPanelUI();
        }
      }

      function updateNotificationBadge(show = true) {
        const badge = document.getElementById('nav-bell-badge');
        if (badge) badge.style.display = show ? 'block' : 'none';
      }

      function updateNotificationPanelUI() {
        const listEl = document.getElementById('notifications-list');
        if (!listEl) return;

        if (notificationHistory.length === 0) {
          listEl.innerHTML = `
            <div class="notifications-empty">
              <i data-lucide="bell-off" style="width: 22px; height: 22px; color: #a1a1aa;"></i>
              <p>No recent medication alerts.</p>
            </div>
          `;
        } else {
          listEl.innerHTML = notificationHistory.map((item) => `
            <div class="notif-history-item notif-${item.type}">
              <div class="notif-item-header">
                <span class="notif-item-title">${item.title}</span>
                <span class="notif-item-time">${item.time}</span>
              </div>
              <p class="notif-item-msg">${item.message}</p>
            </div>
          `).join('');
        }
        lucide.createIcons();
      }

      function clearNotificationHistory() {
        notificationHistory = [];
        updateNotificationPanelUI();
        updateNotificationBadge(false);
      }

      // Shows rich floating toast with sound and adds to notification history
      function showNotification({ title, message, type = 'info', soundType = 'default', medId = null, duration = 4500, skipSound = false }) {
        if (!skipSound && soundEnabled) {
          playNotificationSound(soundType);
        }

        // Add to history
        const now = new Date();
        const timeStr = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        notificationHistory.unshift({ title, message, type, time: timeStr, medId });
        if (notificationHistory.length > 20) notificationHistory.pop();
        updateNotificationBadge(true);
        updateNotificationPanelUI();

        // Native browser notification if supported
        if ('Notification' in window && Notification.permission === 'granted' && type === 'alarm') {
          try {
            new Notification(title, {
              body: message,
              icon: 'favicon.svg'
            });
          } catch (e) {}
        }

        // Render toast in container
        const container = document.getElementById('toast-container');
        if (!container) return;

        const toast = document.createElement('div');
        toast.className = `toast-item toast-${type}`;
        if (type === 'alarm') toast.classList.add('alarm-pulse');

        let iconName = 'bell';
        if (type === 'success') iconName = 'check-circle';
        else if (type === 'warning') iconName = 'alert-triangle';
        else if (type === 'delete') iconName = 'trash-2';
        else if (type === 'alarm') iconName = 'bell-ring';

        toast.innerHTML = `
          <div class="toast-icon-wrap toast-icon-${type}">
            <i data-lucide="${iconName}" style="width: 18px; height: 18px;"></i>
          </div>
          <div class="toast-body">
            <div class="toast-title">${title}</div>
            <div class="toast-message">${message}</div>
            ${medId && type === 'alarm' ? `
              <div class="toast-action-row">
                <button type="button" class="btn-toast-action" onclick="handleDoseFromAlarm(${medId}, this)">
                  <i data-lucide="check" style="width: 13px; height: 13px;"></i>
                  <span>Take Dose</span>
                </button>
              </div>
            ` : ''}
          </div>
          <button type="button" class="toast-close-btn" onclick="dismissToast(this.parentElement)">
            <i data-lucide="x" style="width: 14px; height: 14px;"></i>
          </button>
        `;

        container.prepend(toast);
        lucide.createIcons();

        // Auto dismiss
        setTimeout(() => {
          dismissToast(toast);
        }, duration);
      }

      function dismissToast(el) {
        if (!el || el.dataset.dismissing) return;
        el.dataset.dismissing = 'true';
        el.style.opacity = '0';
        el.style.transform = 'translateY(-10px) scale(0.96)';
        setTimeout(() => {
          if (el.parentElement) el.parentElement.removeChild(el);
        }, 220);
      }

      function handleDoseFromAlarm(medId, btnEl) {
        const med = medicineList.find(m => m.id === medId);
        if (med) {
          handleToggleTaken(med.id, false, med.stock || 15);
        }
        const toast = btnEl.closest('.toast-item');
        if (toast) dismissToast(toast);
      }

      // Instant 12:00 Reminder Alert Tester
      function testReminderAlert() {
        showNotification({
          title: 'Medicine Timeee!!! 🔔',
          message: "It is 12:00 — Time to take rantac (1 tablet)!",
          type: 'alarm',
          soundType: 'alarm',
          medId: 101,
          duration: 12000
        });
      }

      // Backward-compatible alias for existing showToast
      function showToast(message) {
        showNotification({
          title: 'Status Update',
          message,
          type: 'info',
          soundType: 'default',
          duration: 3500
        });
      }

      // Check current time against all scheduled medicines every 3 seconds
      function checkScheduledMedicineReminders() {
        const now = new Date();
        const hh = String(now.getHours()).padStart(2, '0');
        const mm = String(now.getMinutes()).padStart(2, '0');
        const currentTime = `${hh}:${mm}`;
        const dateKey = `${now.getFullYear()}-${now.getMonth() + 1}-${now.getDate()}`;

        medicineList.forEach((med) => {
          if (med.scheduled_time === currentTime && !med.is_taken) {
            const reminderKey = `${dateKey}_${med.id}_${currentTime}`;
            if (!alertedReminders.has(reminderKey)) {
              alertedReminders.add(reminderKey);

              showNotification({
                title: 'Medicine Timeee!!! 🔔',
                message: `It is ${currentTime} — Time to take ${med.name} (${med.dosage})!`,
                type: 'alarm',
                soundType: 'alarm',
                medId: med.id,
                duration: 12000
              });
            }
          }
        });
      }

      // Run reminder clock check
      setInterval(checkScheduledMedicineReminders, 3000);

      // Request browser notification permission politely
      if ('Notification' in window && Notification.permission === 'default') {
        setTimeout(() => {
          Notification.requestPermission();
        }, 4000);
      }

      // Update the cloud status pill in the navbar
      function updateCloudStatusPill(connected) {
        isCloudConnected = connected;
        const dot = document.getElementById('cloud-status-dot');
        const text = document.getElementById('cloud-status-text');
        if (dot && text) {
          if (connected) {
            dot.style.backgroundColor = '#16a34a'; // Green
            text.textContent = 'Cloud Active';
          } else {
            dot.style.backgroundColor = '#ea580c'; // Orange
            text.textContent = 'Cloud Pending';
          }
        }
      }

      // Shows 1-click SQL setup dialog if cloud table is not ready
      function showCloudModal() {
        if (isCloudConnected) {
          alert('Supabase Cloud is Active and fully connected! All changes sync automatically.');
          return;
        }

        const openDashboard = confirm(
          'Supabase Cloud Setup Needed:\n\n' +
          'The "medicines" table is not created in your Supabase project yet.\n\n' +
          'Click OK to open the Supabase SQL Editor directly in your browser. Then paste the SQL script to enable instant cloud syncing!'
        );
        if (openDashboard) {
          window.open('https://supabase.com/dashboard/project/hsztbpkulujygxlaquxj/sql', '_blank');
        }
      }

      // Saves data locally to state and localStorage
      function saveLocally(updatedList) {
        medicineList = updatedList;
        localStorage.setItem(STORAGE_KEY, JSON.stringify(updatedList));
        renderApp();
      }

      // SUPABASE CALL: Fetches medicines from cloud with automatic sync
      async function fetchMedicines() {
        try {
          if (!supabaseClient) throw new Error('Supabase client not loaded');

          const { data, error } = await supabaseClient
            .from('medicines')
            .select('*')
            .order('scheduled_time', { ascending: true });

          if (error) {
            // Table doesn't exist yet in Supabase
            updateCloudStatusPill(false);
            const localSaved = localStorage.getItem(STORAGE_KEY);
            medicineList = localSaved ? JSON.parse(localSaved) : demoMedicines;
          } else {
            // Cloud is active!
            updateCloudStatusPill(true);

            if (data && data.length > 0) {
              medicineList = data;
              localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
            } else {
              // Cloud table exists but is currently empty: upload existing local medicines!
              const localSaved = localStorage.getItem(STORAGE_KEY);
              const itemsToUpload = localSaved ? JSON.parse(localSaved) : demoMedicines;
              medicineList = itemsToUpload;

              for (const item of itemsToUpload) {
                const { id, ...cleanData } = item;
                await supabaseClient.from('medicines').insert([cleanData]);
              }
              showNotification({
                title: 'Cloud Synced ☁️',
                message: 'Synced local medicines to Supabase Cloud!',
                type: 'success',
                soundType: 'default'
              });
            }
          }
        } catch (err) {
          updateCloudStatusPill(false);
          const localSaved = localStorage.getItem(STORAGE_KEY);
          medicineList = localSaved ? JSON.parse(localSaved) : demoMedicines;
        } finally {
          renderApp();
        }
      }

      // Periodically check if table was created in Supabase (every 8 seconds)
      setInterval(async () => {
        if (!isCloudConnected && supabaseClient) {
          try {
            const { error } = await supabaseClient.from('medicines').select('id').limit(1);
            if (!error) {
              updateCloudStatusPill(true);
              fetchMedicines();
            }
          } catch (e) {}
        }
      }, 8000);

      // SUPABASE CALL: Adds a new medicine and syncs to cloud
      async function handleAddMedicine(event) {
        event.preventDefault();

        const nameInput = document.getElementById('form-med-name');
        const dosageInput = document.getElementById('form-med-dosage');
        const timeInput = document.getElementById('form-med-time');
        const stockInput = document.getElementById('form-med-stock');
        const notesInput = document.getElementById('form-med-notes');

        const name = nameInput.value.trim();
        const dosage = dosageInput.value.trim();
        const scheduled_time = timeInput.value;
        const stock = Number(stockInput.value) > 0 ? Number(stockInput.value) : 10;
        const notes = notesInput.value.trim();

        if (!name || !dosage || !scheduled_time) {
          alert('Please fill in medicine name, dosage, and scheduled time.');
          return;
        }

        const newMedicineData = {
          name,
          dosage,
          scheduled_time,
          stock,
          notes,
          is_taken: false
        };

        const localId = Date.now();
        const temporaryItem = { ...newMedicineData, id: localId };
        saveLocally([...medicineList, temporaryItem]);

        // Reset form inputs
        nameInput.value = '';
        dosageInput.value = '';
        timeInput.value = '';
        stockInput.value = '30';
        notesInput.value = '';

        // Notification popup with sound for new medicine!
        showNotification({
          title: 'Medicine Added 🎉',
          message: `Registered ${name} (${dosage}) scheduled for ${scheduled_time}!`,
          type: 'success',
          soundType: 'add'
        });

        // Sync to Supabase Cloud
        try {
          if (supabaseClient) {
            const { data, error } = await supabaseClient
              .from('medicines')
              .insert([newMedicineData])
              .select();

            if (!error && data && data[0]) {
              updateCloudStatusPill(true);
              // Update with cloud database ID
              const syncedList = medicineList.map((m) => m.id === localId ? data[0] : m);
              saveLocally(syncedList);
            } else if (error) {
              updateCloudStatusPill(false);
            }
          }
        } catch (err) {
          updateCloudStatusPill(false);
        }
      }

      // SUPABASE CALL: Toggles taken status and decrements/restores stock count
      async function handleToggleTaken(id, currentStatus, currentStock) {
        const updatedStatus = !currentStatus;
        const updatedStock = updatedStatus ? Math.max(0, currentStock - 1) : currentStock + 1;

        let targetMedName = 'Medicine';
        const updatedList = medicineList.map((item) => {
          if (item.id === id) {
            targetMedName = item.name;
            return { ...item, is_taken: updatedStatus, stock: updatedStock };
          }
          return item;
        });
        saveLocally(updatedList);

        // Notification popup with sound for dose change!
        if (updatedStatus) {
          showNotification({
            title: 'Dose Recorded ✅',
            message: `Marked ${targetMedName} as taken. Remaining stock: ${updatedStock} doses.`,
            type: 'info',
            soundType: 'default'
          });
        } else {
          showNotification({
            title: 'Dose Restored 🔄',
            message: `Restored ${targetMedName} to pending schedule.`,
            type: 'info',
            soundType: 'default'
          });
        }

        try {
          if (supabaseClient && isCloudConnected) {
            await supabaseClient
              .from('medicines')
              .update({ is_taken: updatedStatus, stock: updatedStock })
              .eq('id', id);
          }
        } catch (err) {}
      }

      // Quick restock (+5 doses) with notification & sound
      function handleRestock(id) {
        let targetMedName = 'Medicine';
        let newStockCount = 0;
        const updatedList = medicineList.map((item) => {
          if (item.id === id) {
            targetMedName = item.name;
            newStockCount = (Number(item.stock) || 0) + 5;
            return { ...item, stock: newStockCount };
          }
          return item;
        });
        saveLocally(updatedList);

        showNotification({
          title: 'Stock Refilled 📦',
          message: `Added +5 doses to ${targetMedName}. Current stock: ${newStockCount} doses.`,
          type: 'success',
          soundType: 'add'
        });

        try {
          if (supabaseClient && isCloudConnected) {
            const updatedItem = updatedList.find((m) => m.id === id);
            if (updatedItem) {
              supabaseClient
                .from('medicines')
                .update({ stock: updatedItem.stock })
                .eq('id', id);
            }
          }
        } catch (err) {}
      }

      // SUPABASE CALL: Deletes a medicine reminder with notification & sound
      async function handleDeleteMedicine(id, name) {
        if (!confirm(`Remove ${name} from schedule?`)) return;

        const updatedList = medicineList.filter((item) => item.id !== id);
        saveLocally(updatedList);

        showNotification({
          title: 'Medicine Removed 🗑️',
          message: `Removed ${name} from your schedule.`,
          type: 'warning',
          soundType: 'delete'
        });

        try {
          if (supabaseClient && isCloudConnected) {
            await supabaseClient.from('medicines').delete().eq('id', id);
          }
        } catch (err) {}
      }

      // Section Switching
      function setSection(section) {
        activeSection = section;

        const navIds = ['dashboard', 'prescriptions', 'schedule', 'stock', 'saved'];
        navIds.forEach((id) => {
          const btn = document.getElementById(`nav-btn-${id}`);
          if (btn) {
            if (id === section) {
              btn.classList.add('active');
            } else {
              btn.classList.remove('active');
            }
          }
        });

        renderApp();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }

      // Filter Switching
      function setFilter(filter) {
        currentFilter = filter;
        renderApp();
      }

      // Search Filtering
      function handleSearch(query) {
        searchQuery = query;
        renderApp();
      }

      // Filters the medicine list based on active tab and search query
      function getFilteredMedicines() {
        return medicineList.filter((item) => {
          const matchesSearch = item.name.toLowerCase().includes(searchQuery.toLowerCase());
          const stockVal = item.stock !== undefined && item.stock !== null ? Number(item.stock) : 15;

          if (!matchesSearch) return false;
          if (currentFilter === 'pending') return item.is_taken === false;
          if (currentFilter === 'taken') return item.is_taken === true;
          if (currentFilter === 'low_stock') return stockVal <= 5;
          return true;
        });
      }

      // HTML Renderers for Sections
      function renderApp() {
        const container = document.getElementById('view-container');
        if (!container) return;

        const filtered = getFilteredMedicines();

        if (activeSection === 'dashboard' || activeSection === 'prescriptions') {
          container.innerHTML = `
            <section class="section-header-row">
              <h2 class="section-title">My Prescriptions</h2>
              <div class="filter-pill-group">
                <button type="button" class="filter-pill ${currentFilter === 'all' ? 'active' : ''}" onclick="setFilter('all')">All Prescriptions</button>
                <button type="button" class="filter-pill ${currentFilter === 'pending' ? 'active' : ''}" onclick="setFilter('pending')">Pending</button>
                <button type="button" class="filter-pill ${currentFilter === 'taken' ? 'active' : ''}" onclick="setFilter('taken')">Taken</button>
                <button type="button" class="filter-pill ${currentFilter === 'low_stock' ? 'active' : ''}" onclick="setFilter('low_stock')">Low Stock</button>
              </div>
            </section>

            <section class="cards-row">
              ${filtered.slice(0, 3).map((item, idx) => renderPastelCard(item, idx)).join('')}
              ${filtered.length === 0 ? '<p style="grid-column: 1 / -1; color: #52525b; font-weight: 700;">No prescriptions match this filter.</p>' : ''}
            </section>

            <section class="bottom-grid">
              <div class="schedule-panel">
                <div class="panel-header-row">
                  <h3 class="panel-title">Daily Intake Schedule</h3>
                  <button type="button" class="panel-subtitle-link" style="background: transparent; border: none;" onclick="setSection('schedule')">
                    View all lessons &bull;
                  </button>
                </div>
                ${renderScheduleRows(filtered)}
              </div>

              <div class="dark-form-panel">
                <span class="dark-card-tag">Stock &amp; Inventory</span>
                <h3 class="dark-card-title">Add Your Specific Medicine</h3>
                <form class="dark-form-fields" onsubmit="handleAddMedicine(event)">
                  <input id="form-med-name" class="dark-input" type="text" placeholder="Medicine name (e.g. Paracetamol)" required />
                  <input id="form-med-dosage" class="dark-input" type="text" placeholder="Dosage (e.g. 500mg, 1 tablet)" required />
                  <div class="dark-input-row">
                    <input id="form-med-time" class="dark-input" type="time" required />
                    <input id="form-med-stock" class="dark-input" type="number" min="1" max="200" value="30" placeholder="Stock (pills)" required />
                  </div>
                  <input id="form-med-notes" class="dark-input" type="text" placeholder="Notes (optional, e.g. after food)" />
                  <button type="submit" class="btn-dark-submit">
                    <i data-lucide="plus-circle" style="width: 18px; height: 18px;"></i>
                    <span>Register Medicine</span>
                  </button>
                </form>
              </div>
            </section>
          `;
        } else if (activeSection === 'schedule') {
          container.innerHTML = `
            <section style="display: flex; flex-direction: column; gap: 1.5rem;">
              <div class="section-header-row">
                <h2 class="section-title">Full Medication Schedule</h2>
                <button type="button" class="filter-pill active" onclick="setSection('dashboard')">&larr; Back to Dashboard</button>
              </div>
              <div class="schedule-panel">
                ${renderScheduleRows(filtered)}
              </div>
            </section>
          `;
        } else if (activeSection === 'stock') {
          container.innerHTML = `
            <section style="display: flex; flex-direction: column; gap: 1.5rem;">
              <div class="section-header-row">
                <h2 class="section-title">Stock &amp; Inventory Tracker</h2>
                <button type="button" class="filter-pill active" onclick="setSection('dashboard')">&larr; Back to Dashboard</button>
              </div>
              <div class="cards-row">
                ${medicineList.map((item) => `
                  <div class="prescription-card card-theme-yellow" style="min-height: 180px;">
                    <h3 class="card-medicine-title">${item.name}</h3>
                    <p class="card-dosage-text">${item.dosage}</p>
                    <div class="card-stock-section">
                      <div class="stock-label-row">
                        <span>Remaining: ${item.stock || 0} doses</span>
                        <span>${(item.stock || 0) <= 5 ? 'Restock Needed!' : 'Sufficient'}</span>
                      </div>
                    </div>
                    <div class="card-bottom-row">
                      <span class="stock-pill-badge">${item.scheduled_time}</span>
                      <button type="button" class="btn-continue" onclick="handleRestock(${item.id})">
                        <i data-lucide="refresh-cw" style="width: 12px; height: 12px;"></i>
                        <span>+5 Refill</span>
                      </button>
                    </div>
                  </div>
                `).join('')}
              </div>
            </section>
          `;
        } else if (activeSection === 'saved') {
          container.innerHTML = `
            <section style="display: flex; flex-direction: column; gap: 1.5rem;">
              <div class="section-header-row">
                <h2 class="section-title">Saved Prescriptions (${medicineList.length})</h2>
                <button type="button" class="filter-pill active" onclick="setSection('dashboard')">&larr; Back to Dashboard</button>
              </div>
              <div class="cards-row">
                ${medicineList.map((item, idx) => renderPastelCard(item, idx)).join('')}
              </div>
            </section>
          `;
        }

        // Initialize Lucide icons on dynamic elements
        lucide.createIcons();
      }

      function renderPastelCard(item, index) {
        const colorThemes = ['card-theme-yellow', 'card-theme-purple', 'card-theme-blue'];
        const themeClass = colorThemes[index % colorThemes.length];
        const currentStock = item.stock !== undefined && item.stock !== null ? Number(item.stock) : 15;
        const totalStock = 30;
        const stockPercentage = Math.min(100, Math.max(0, Math.round((currentStock / totalStock) * 100)));
        const isLowStock = currentStock <= 5;

        return `
          <div class="prescription-card ${themeClass}">
            <div class="card-top-bar">
              <span class="card-tag">
                <i data-lucide="package" style="width: 12px; height: 12px;"></i>
                <span>${item.scheduled_time || 'Daily'}</span>
              </span>
              <i data-lucide="bookmark" class="card-bookmark-icon" style="width: 18px; height: 18px;"></i>
            </div>

            <h3 class="card-medicine-title">${item.name}</h3>
            <p class="card-dosage-text">${item.dosage}</p>

            <div class="card-stock-section">
              <div class="stock-label-row">
                <span>Stock Level</span>
                <span>${currentStock} / ${totalStock} doses</span>
              </div>
              <div class="progress-track">
                <div class="progress-fill ${isLowStock ? 'low-stock' : ''}" style="width: ${stockPercentage}%;"></div>
              </div>
            </div>

            <div class="card-bottom-row">
              <span class="stock-pill-badge">${isLowStock ? 'Low Stock!' : currentStock + ' left'}</span>
              <button
                type="button"
                class="btn-continue ${item.is_taken ? 'completed' : ''}"
                onclick="handleToggleTaken(${item.id}, ${item.is_taken}, ${currentStock})"
              >
                <i data-lucide="${item.is_taken ? 'rotate-ccw' : 'check'}" style="width: 13px; height: 13px;"></i>
                <span>${item.is_taken ? 'Undo' : 'Take Dose'}</span>
              </button>
            </div>
          </div>
        `;
      }

      function renderScheduleRows(list) {
        if (list.length === 0) {
          return `
            <div class="state-box">
              <i data-lucide="pill" style="width: 32px; height: 32px; color: #94a3b8;"></i>
              <p>No medicines scheduled yet. Add your specific prescription on the right.</p>
            </div>
          `;
        }

        return `
          <div class="schedule-list">
            ${list.map((item) => {
              const stockCount = item.stock !== undefined && item.stock !== null ? Number(item.stock) : 15;
              const isLow = stockCount <= 5;

              return `
                <div class="schedule-row">
                  <div class="schedule-item-info">
                    <button
                      type="button"
                      class="schedule-bullet-pill ${item.is_taken ? 'taken' : ''}"
                      onclick="handleToggleTaken(${item.id}, ${item.is_taken}, ${stockCount})"
                      title="${item.is_taken ? 'Mark as pending' : 'Mark as taken'}"
                    >
                      <i data-lucide="${item.is_taken ? 'check' : 'clock'}" style="width: 16px; height: 16px;"></i>
                    </button>
                    <div class="schedule-text-details">
                      <span class="schedule-name ${item.is_taken ? 'strike' : ''}">${item.name}</span>
                      <span class="schedule-sub">${item.dosage} ${item.notes ? `• ${item.notes}` : ''}</span>
                    </div>
                  </div>

                  <div class="schedule-meta-right">
                    <span class="schedule-stock-tag ${isLow ? 'warning' : ''}">${isLow ? `Low: ${stockCount} left` : `${stockCount} in stock`}</span>
                    <span class="schedule-time-label">${item.scheduled_time}</span>
                    <button
                      type="button"
                      class="schedule-action-btn"
                      onclick="handleDeleteMedicine(${item.id}, '${item.name}')"
                      title="Delete reminder"
                    >
                      <i data-lucide="trash-2" style="width: 16px; height: 16px;"></i>
                    </button>
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        `;
      }

      // Initialize on page load
      fetchMedicines();
    </script>
  </body>
</html>
